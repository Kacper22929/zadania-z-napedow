<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zadania z napędów — silnik obcowzbudny DC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1218; --panel:rgba(23,28,37,.86); --panel2:rgba(31,38,50,.9); --line:#2a3342;
  --txt:#e8edf5; --mut:#93a0b4; --acc:#ffb020; --acc2:#3ec7ff;
  --ok:#35d07f; --bad:#ff5a6a; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--txt);font:16px/1.55 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(15,18,24,.25),rgba(15,18,24,.55)),url("tlo.jpg") center/cover no-repeat}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:calc(18px + var(--safe-t)) 14px calc(96px + var(--safe-b))}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#ff6a00);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
header.top h1{font-size:19px;margin:0;line-height:1.1}
header.top p{margin:0;color:#e8edf5;font-size:13px}
header.top h1,header.top p{text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 2px #000}
.pts{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.pts b{color:var(--acc)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(15,18,24,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:12px;color:var(--mut);font-size:10.5px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);background:var(--panel)}
@media(min-width:820px){
  nav.tabs{position:sticky;top:0;bottom:auto;border:0;background:rgba(15,18,24,.6);border-radius:14px;padding:0 0 10px;margin-bottom:8px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:6px;font-size:13px;padding:10px 2px;border:1px solid var(--line)}
  .wrap{padding-bottom:40px}
}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--acc);color:#1a1200;font-weight:700;padding:14px 18px;border-radius:14px;min-height:50px;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.full{width:100%}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff6a00);width:0;transition:width .3s}

.hero{padding:22px;background:radial-gradient(120% 120% at 100% 0,#3a2a07 0,var(--panel) 55%)}
.hero h2{margin:0 0 6px;font-size:23px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:118px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .08s}
.tile:hover{border-color:var(--acc)}
.tile:active{transform:scale(.98)}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-family:"Space Grotesk";font-size:17px}
.tile span{font-size:13px;color:var(--mut)}
.tile em{font-style:normal;font-size:12px;color:var(--acc);margin-top:auto}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.tile.wide div:last-child{display:flex;flex-direction:column}

/* przebieg */
.sec{margin-top:14px}
.sec h2{font-size:20px;margin:0 0 4px;display:flex;gap:10px;align-items:center}
.sec h2 .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--acc);color:#1a1200;display:grid;place-items:center;font-size:15px}
.sec h3{font-size:17px;margin:16px 0 4px;color:var(--acc)}
.sec p{margin:6px 0}
.sec ul{margin:6px 0;padding-left:20px}
.sec li{margin:4px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:4px;vertical-align:1px}
.t-dol{background:rgba(62,199,255,.15);color:var(--acc2)}
.t-gora{background:rgba(255,176,32,.15);color:var(--acc)}
.t-plus{background:rgba(53,208,127,.15);color:var(--ok)}
.t-minus{background:rgba(255,90,106,.15);color:var(--bad)}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.m h4{margin:0 0 6px;font-family:"Space Grotesk";font-size:17px}
.chart{background:var(--bg);border-radius:12px;margin:10px 0 4px;padding:4px}
.chart svg{display:block;width:100%;height:auto}
.cap{font-size:13px;color:var(--mut);text-align:center}
.warn{border-left:4px solid var(--bad);background:rgba(255,90,106,.08);padding:10px 12px;border-radius:10px;margin:10px 0}
.hot{border-left:4px solid var(--acc);background:rgba(255,176,32,.08);padding:10px 12px;border-radius:10px;margin:10px 0}
.qa details{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin-top:10px}
.qa summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";color:var(--acc);font-size:22px;line-height:1;flex:none}
.qa details[open] summary::after{content:"–"}
.qa .a{padding:0 0 12px}
.toc{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:rgba(15,18,24,.7);border-radius:12px}
.toc a{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--txt);text-decoration:none}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:0 0 8px}
.qtext{font-size:19px;font-weight:600;margin:14px 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:13px 15px;min-height:54px;font-size:16px;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:rgba(53,208,127,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,90,106,.12)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);border-left:4px solid var(--acc2);font-size:15px;display:none}
.expl.on{display:block}
.result{text-align:center;padding:26px 18px}
.big{font-size:56px;font-family:"Space Grotesk";font-weight:700;color:var(--acc);line-height:1}

/* flash */
.flash{perspective:1200px;height:320px;margin:12px 0;touch-action:pan-y}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);overflow:auto}
.face.front{background:linear-gradient(160deg,#232b39,var(--panel))}
.face.front h3{font-size:25px;margin:0}
.face.back{background:linear-gradient(160deg,#10283a,var(--panel));transform:rotateY(180deg);font-size:16.5px}
.face small{position:absolute;bottom:12px;color:var(--mut);font-size:12px}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pc{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:68px;font-size:14px;line-height:1.3;text-align:center;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pc.term{font-weight:700;font-family:"Space Grotesk";font-size:15px}
.pc.sel{border-color:var(--acc2);background:rgba(62,199,255,.12)}
.pc.done{opacity:.25;border-color:var(--ok);pointer-events:none}
.pc.wrong{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* tf */
.tfcard{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:600;padding:22px;line-height:1.4;transition:background .2s}
.tfcard.ok{background:rgba(53,208,127,.15)}
.tfcard.bad{background:rgba(255,90,106,.15)}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tfbtns button{min-height:76px;border-radius:18px;font-size:20px;font-weight:700;font-family:"Space Grotesk"}
.tfy{background:var(--ok);color:#03200f}
.tfn{background:var(--bad);color:#2a0006}
.timer{font-family:"Space Grotesk";font-size:28px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:20;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <div><h1>Zadania z napędów</h1><p>Silnik obcowzbudny DC</p></div>
    <div class="pts">⚡ <b id="xp">0</b> XP</div>
  </header>

  <nav class="tabs"><div class="in" id="nav"></div></nav>

  <section class="view on" id="v-home">
    <div class="card hero">
      <h2>Silnik obcowzbudny prądu stałego</h2>
      <div class="muted">Regulacja prędkości, hamowanie elektryczne i charakterystyki. Zacznij od przebiegu zajęć, potem sprawdź się w grach.</div>
    </div>
    <div class="grid" id="tiles"></div>
  </section>

  <section class="view" id="v-plan"><div id="plan"></div></section>
  <section class="view" id="v-quiz"><div class="card" id="quizBox"></div></section>

  <section class="view" id="v-flash">
    <div class="card">
      <div class="qhead"><span id="fCount"></span><span id="fKnown"></span></div>
      <div class="bar"><i id="fBar"></i></div>
      <div class="flash" id="flash"><div class="in">
        <div class="face front"><h3 id="fTerm"></h3><small>dotknij, aby odwrócić · przesuń, aby zmienić</small></div>
        <div class="face back"><div id="fDef"></div><small>dotknij, aby wrócić</small></div>
      </div></div>
      <div class="fbtns">
        <button class="btn sec" id="fAgain">🔁 Jeszcze raz</button>
        <button class="btn" id="fGot">✓ Umiem</button>
      </div>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <button class="chip" id="fShuffle">Przetasuj</button>
        <button class="chip" id="fReset">Zacznij od nowa</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-pairs">
    <div class="card">
      <div class="qhead"><span>Połącz pojęcie z opisem</span><span id="pStat"></span></div>
      <div class="pairs" id="pairs"></div>
      <div id="pEnd" style="display:none;margin-top:14px"></div>
    </div>
  </section>

  <section class="view" id="v-tf"><div class="card" id="tfBox"></div></section>
  <section class="view" id="v-wyk"><div class="card" id="wykBox"></div></section>
</div>
<div class="toast" id="toast"></div>

<script>
/* =================== WYKRESY (SVG) =================== */
const COL=['#ffb020','#3ec7ff','#b388ff','#35d07f','#ff7a59'];
function plot(o){
  const W=340,H=250,l=36,r=16,t=16,b=30,[x0,x1]=o.x,[y0,y1]=o.y;
  const X=v=>l+(v-x0)/(x1-x0)*(W-l-r), Y=v=>t+(y1-v)/(y1-y0)*(H-t-b);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#93a0b4"/></marker></defs>`;
  if(o.quad){s+=`<rect x="${X(x0)}" y="${Y(y1)}" width="${X(0)-X(x0)}" height="${Y(y0)-Y(y1)}" fill="#ff5a6a" opacity=".05"/>
    <text x="${(X(x0)+X(0))/2}" y="${Y(y1)+14}" fill="#93a0b4" font-size="10" text-anchor="middle">II kw. — hamowanie</text>
    <text x="${(X(0)+X(x1))/2}" y="${Y(y1)+14}" fill="#93a0b4" font-size="10" text-anchor="middle">I kw. — praca silnikowa</text>`}
  s+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" stroke="#93a0b4" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" stroke="#93a0b4" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="${X(0)+7}" y="${Y(y1)+6}" fill="#e8edf5" font-size="14" font-weight="700">ω</text>
  <text x="${X(x1)-2}" y="${Y(0)+20}" fill="#e8edf5" font-size="12" text-anchor="end" font-weight="600">${o.xl||'I<tspan font-size="9" dy="3">t</tspan><tspan dy="-3">, M</tspan><tspan font-size="9" dy="3">e</tspan>'}</text>`;
  (o.lines||[]).forEach((ln,i)=>{
    const c=ln.c||COL[i%COL.length];const d=ln.p.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${ln.w||2.6}" stroke-linecap="round" ${ln.dash?'stroke-dasharray="6 5"':''}/>`;
    if(o.labels!==false&&ln.lab){const e=ln.at||ln.p[ln.p.length-1];s+=`<text x="${X(e[0])+(ln.dx||4)}" y="${Y(e[1])+(ln.dy||4)}" fill="${c}" font-size="11.5" font-weight="700" text-anchor="${ln.anc||'start'}">${ln.lab}</text>`}
  });
  if(o.labels!==false)(o.marks||[]).forEach(m=>{
    if(m.axis==='y')s+=`<line x1="${X(0)-4}" x2="${X(0)+4}" y1="${Y(m.v)}" y2="${Y(m.v)}" stroke="#e8edf5"/><text x="${X(0)-6}" y="${Y(m.v)+4}" fill="#e8edf5" font-size="11" text-anchor="end">${m.t}</text>`;
    else s+=`<line y1="${Y(0)-4}" y2="${Y(0)+4}" x1="${X(m.v)}" x2="${X(m.v)}" stroke="#e8edf5"/><text x="${X(m.v)}" y="${Y(0)+18}" fill="#e8edf5" font-size="11" text-anchor="middle">${m.t}</text>`;
  });
  return s+'</svg>';
}
const sub=(a,b)=>`${a}<tspan font-size="8.5" dy="3">${b}</tspan><tspan dy="-3">\u200b</tspan>`;
const seg=(w0,k,xmax)=>[[0,w0],[Math.min(xmax,w0/k),Math.max(0,w0-k*xmax)]];
const CH={
 nat:lab=>plot({x:[-.1,1.25],y:[-.1,1.3],labels:lab,marks:[{axis:'y',v:1,t:sub('ω','0')}],
   lines:[{p:[[0,1],[1.15,.86]],lab:'naturalna',dy:-8,anc:'end',dx:0}]}),
 rd:lab=>plot({x:[-.1,1.25],y:[-.1,1.3],labels:lab,marks:[{axis:'y',v:1,t:sub('ω','0')}],
   lines:[{p:seg(1,.12,1.15),lab:'R<tspan font-size="8.5" dy="3">d</tspan><tspan dy="-3"> = 0 (nat.)</tspan>',dy:-7,anc:'end',dx:0},
          {p:seg(1,.4,1.15),lab:sub('R','d1'),dy:-6},{p:seg(1,.75,1.15),lab:sub('R','d2'),dx:6,dy:-2},{p:seg(1,1.25,1.15),lab:sub('R','d3'),dx:4,dy:-8}]}),
 ut:lab=>plot({x:[-.1,1.25],y:[-.1,1.3],labels:lab,marks:[{axis:'y',v:1,t:sub('ω','0N')},{axis:'y',v:.68,t:sub('ω','01')},{axis:'y',v:.38,t:sub('ω','02')}],
   lines:[{p:seg(1,.15,1.15),lab:sub('U','tN'),dy:-6},{p:seg(.68,.15,1.15),lab:sub('U','t1'),dy:-6},{p:seg(.38,.15,1.15),lab:sub('U','t2'),dy:-6}]}),
 fi_i:lab=>plot({x:[-.1,1.8],y:[-.1,1.4],labels:lab,xl:'I<tspan font-size="9" dy="3">t</tspan>',marks:[{axis:'y',v:.6,t:sub('ω','0N')},{axis:'y',v:.9,t:sub('ω','01')},{axis:'y',v:1.25,t:sub('ω','02')},{axis:'x',v:1.6,t:sub('I','tz')}],
   lines:[{p:[[0,.6],[1.6,0]],lab:sub('Φ','wN'),at:[.45,.43],dy:-6},{p:[[0,.9],[1.6,0]],lab:sub('Φ','w1'),at:[.55,.59],dy:-6},{p:[[0,1.25],[1.6,0]],lab:sub('Φ','w2'),at:[.6,.78],dy:-6}]}),
 fi_m:lab=>plot({x:[-.1,1.8],y:[-.1,1.4],labels:lab,xl:'M<tspan font-size="9" dy="3">e</tspan>',marks:[{axis:'y',v:.6,t:sub('ω','0N')},{axis:'y',v:.9,t:sub('ω','01')},{axis:'y',v:1.25,t:sub('ω','02')}],
   lines:[{p:[[0,.6],[1.6,0]],lab:sub('Φ','wN'),at:[1.25,.13],dy:-8},{p:[[0,.9],[1.07,0]],lab:sub('Φ','w1'),at:[.9,.15],dx:6},{p:[[0,1.25],[.77,0]],lab:sub('Φ','w2'),at:[.45,.52],dx:6}]}),
 dyn:lab=>plot({x:[-1.3,1.2],y:[-.25,1.35],quad:1,labels:lab,
   lines:[{p:[[0,1],[1.1,.88]],lab:'naturalna',dy:-8,anc:'end',dx:0},{p:[[0,0],[-1.25,.55]],lab:sub('R','h1'),dy:-6,dx:0},{p:[[0,0],[-.62,1.15]],lab:sub('R','h2'),dy:-4,dx:-20}]}),
 prz:lab=>plot({x:[-1.3,1.2],y:[-1.2,1.35],quad:1,labels:lab,marks:[{axis:'y',v:-1,t:'−ω<tspan font-size="8.5" dy="3">0</tspan>'},{axis:'y',v:1,t:sub('ω','0')}],
   lines:[{p:[[0,1],[1.1,.88]],lab:'naturalna',dy:-8,anc:'end',dx:0},{p:[[0,-1],[-1.2,.95]],lab:'przeciwwłączenie',at:[-1.2,.95],dy:-6,dx:0}]}),
 odz:lab=>plot({x:[-1.3,1.2],y:[-.25,1.4],quad:1,labels:lab,marks:[{axis:'y',v:1,t:sub('ω','0')}],
   lines:[{p:[[0,1],[1.1,.86]],lab:'praca silnikowa',dy:-8,anc:'end',dx:0},{p:[[-1.2,1.15],[0,1]],c:'#35d07f',lab:'ω > ω<tspan font-size="8.5" dy="3">0</tspan>',at:[-1.2,1.15],dy:-8,dx:0}]})
};
const fig=(k,cap)=>`<div class="chart">${CH[k](true)}</div>${cap?`<div class="cap">${cap}</div>`:''}`;

/* =================== TREŚĆ =================== */
const S=(a,b)=>`${a}<sub>${b}</sub>`;
const FISZKI=[

<h3>Temat</h3><p>Badamy <b>silnik obcowzbudny prądu stałego (DC)</b>. Ma dwa całkowicie niezależne obwody zasilane osobno: <b>obwód twornika</b> (wirnik) i <b>obwód wzbudzenia</b> (stojan, który tworzy pole magnetyczne).</p>
<h3>Cel</h3><p>Uczymy się kształtować charakterystyki silnika, czyli sterować jego prędkością i momentem, w dwóch stanach: podczas <b>normalnej pracy silnikowej</b> i podczas <b>hamowania elektrycznego</b>.</p>

<p><span class="tag t-dol">„W DÓŁ”</span>nie można przekroczyć napięcia znamionowego</p>
<p><b>Wykres:</b> zbiór prostych równoległych, które przesuwają się w dół, gdy napięcie maleje.</p>
<p><span class="tag t-plus">ZALETY</span><b>Najlepsza metoda.</b> Wysoka sprawność (brak strat na rezystorach), płynna regulacja i stała sztywność, czyli nachylenie wykresu.</p>
${fig('ut',`„Schodki równoległe”: ${S('U','t2')} < ${S('U','t1')} < ${S('U','tN')}`)}</div>
<div class="m"><h4>3. Zmiana strumienia wzbudzenia (${S('Φ','w')} / prądu ${S('I','w')})</h4>
<p><span class="tag t-gora">„W GÓRĘ”</span>powyżej prędkości znamionowej</p>
<p>Prędkość zwiększamy przez <b>osłabianie strumienia</b>, czyli zmniejszanie ${S('I','w')}. Proste stają się coraz bardziej strome, ale uciekają w górę osi prędkości.</p>
<p><span class="tag t-plus">ZALETA</span>małe straty mocy, więc metoda jest ekonomiczna. <span class="tag t-minus">UWAGA</span>moment dopuszczalny spada hiperbolicznie.</p>
${fig('fi_i',`ω = f(${S('I','t')}): wszystkie proste schodzą się w ${S('I','tz')} (prąd zwarcia)`)}
${fig('fi_m',`ω = f(${S('M','e')}): proste się przecinają, nie ma wspólnego punktu na dole`)}</div>
</div>

<div class="card sec" id="p3"><h2><span class="n">3</span>Trzy metody hamowania elektrycznego</h2>
<p class="muted">Pytanie: „Jak możemy zahamować ten silnik prądem?”</p>
<div class="m"><h4>Hamowanie odzyskowe (prądnicowe)</h4>
<p><b>Kiedy:</b> gdy prędkość przekroczy prędkość biegu jałowego (ω > ${S('ω','0')}), np. przy opuszczaniu ciężaru na dźwigu.</p>
<p><b>Co się dzieje:</b> silnik staje się prądnicą i oddaje energię z powrotem do sieci lub źródła, o ile źródło potrafi ją przyjąć (np. akumulator).</p>
${fig('odz','Odzyskowe: przedłużenie charakterystyki ponad ω0')}</div>
<div class="m"><h4>Hamowanie dynamiczne (rezystorowe)</h4>
<p><b>Jak:</b> odłączamy twornik od zasilania (${S('U','t')} = 0) i zwieramy go przez rezystor hamowania ${S('R','h')}. <b>Wzbudzenie zostaje włączone!</b></p>
<p><b>Co się dzieje:</b> energia kinetyczna wirnika zamienia się w prąd i wytraca się jako ciepło na rezystorze.</p>
<p><b>Wykres:</b> proste przechodzą przez środek układu (0,0). Im większe ${S('R','h')}, tym wyżej (bardziej stromo) idzie prosta.</p>
<p><span class="tag t-minus">WADA</span>im wolniej silnik się kręci, tym słabiej hamuje. Przy prędkości zerowej moment hamujący wynosi zero.</p>
${fig('dyn','Dynamiczne: proste z (0,0) w II kwadrancie')}</div>
<div class="m"><h4>Hamowanie przeciwwłączeniem (przeciwprądowe)</h4>
<p><b>Jak:</b> podczas pracy przełączamy biegunowość napięcia twornika na przeciwną i <b>obowiązkowo dokładamy duży rezystor ${S('R','h')}</b>, żeby ogromny prąd nie spalił uzwojeń.</p>
<p><span class="tag t-plus">ZALETA</span>hamowanie bardzo gwałtowne i skuteczne, działa aż do pełnego zatrzymania (przy ω = 0 nadal jest duży moment hamujący).</p>
<p><span class="tag t-minus">WADY</span>ogromne straty energii, bo silnik ciągnie prąd z sieci i jednocześnie wytraca energię mechaniczną na ciepło.</p>
<div class="warn"><b>Haczyk:</b> w momencie zatrzymania (ω = 0) trzeba natychmiast odłączyć zasilanie, inaczej silnik zacznie się rozpędzać w drugą stronę!</div>
${fig('prz','Przeciwwłączenie: prosta idzie aż do −ω0 poniżej zera')}</div>
</div>

<div class="card sec qa" id="p4"><h2><span class="n">4</span>Typowe pytania podchwytliwe</h2>
<details open><summary>Dlaczego najpierw załączamy wzbudzenie, a dopiero potem twornik? Dlaczego nie wolno przerwać obwodu wzbudzenia podczas pracy?</summary><div class="a">Prąd wzbudzenia tworzy strumień magnetyczny ${S('Φ','w')}, a prędkość jest odwrotnie proporcjonalna do strumienia. Jeśli strumień spadnie do zera przy podłączonym napięciu twornika, silnik spróbuje się rozbiegać do nieskończonej prędkości i ulegnie rozerwaniu mechanicznemu. Do tego przez twornik popłynie gigantyczny prąd zwarcia.</div></details>
<details><summary>Dlaczego przy sterowaniu wzbudzeniem tylko osłabiamy prąd wzbudzenia, a nie zwiększamy go ponad znamionowy?</summary><div class="a">Bo obwód magnetyczny ulega <b>nasyceniu</b>. Dalsze zwiększanie prądu wzbudzenia prawie nie zwiększy strumienia, a jedynie przegrzeje i spali uzwojenie wzbudzenia.</div></details>
<details><summary>Czym na stanowisku obciążamy badany silnik?</summary><div class="a">Drugą maszyną prądu stałego (${S('M','p')}) połączoną na sztywno na jednym wale. Podczas badania pracy silnikowej pracuje jako <b>prądnica (hamulec)</b> i oddaje moc na rezystor obciążenia, a podczas badania hamowania sama pracuje jako <b>silnik</b> i napędza badany układ.</div></details>
<details><summary>Co to jest sztywność / ustępliwość charakterystyki?</summary><div class="a">To miara tego, jak bardzo spada prędkość silnika, gdy zaczynamy go obciążać. Charakterystyka naturalna i napięciowa są <b>sztywne</b> (mała ustępliwość, prędkość mało spada). Charakterystyka z dodatkowym rezystorem ${S('R','d')} jest <b>miękka</b> (duża ustępliwość, silnik pod obciążeniem mocno zwalnia).</div></details>
</div>

<div class="card sec qa" id="p5"><h2><span class="n">5</span>Co konkretnie pyta (od kolegów)</h2>
<div class="hot">Krótkie odpowiedzi, które działają jak ściągawka.</div>
<details open><summary>Co włączamy pierwsze: wzbudzenie czy twornik?</summary><div class="a">Zawsze najpierw <b>WZBUDZENIE</b> (ustawiamy prąd znamionowy ${S('I','wN')}), a dopiero potem napięcie na twornik. Wyłączamy odwrotnie: najpierw twornik, na końcu wzbudzenie.<br><br><b>Dlaczego? (to pytanie na 100% padnie)</b> Prąd wzbudzenia wytwarza strumień ${S('Φ','w')}. Gdyby podać napięcie na twornik bez wzbudzenia (${S('Φ','w')} ≈ 0):<ul><li>w tworniku nie indukowałaby się SEM ${S('E','s')} i popłynąłby gigantyczny prąd zwarcia, który spaliłby uzwojenia,</li><li>na biegu jałowym, ponieważ ${S('ω','0')} ~ 1/${S('Φ','w')}, silnik zacząłby się rozbiegać do nieskończenie wielkiej prędkości, co grozi rozerwaniem wirnika.</li></ul></div></details>
<details><summary>Dlaczego nazywa się „obcowzbudny”?</summary><div class="a">Obwód wzbudzenia (elektromagnes w stojanie) i obwód twornika (wirnik) są od siebie elektrycznie całkowicie odseparowane i zasilane z <b>dwóch osobnych, niezależnych źródeł napięcia</b>. Pole magnetyczne pochodzi z „obcego”, zewnętrznego zasilacza, a nie z tego samego źródła co prąd wirnika.</div></details>
<details><summary>Jak działa silnik obcowzbudny (osobne zasilanie)?</summary><div class="a"><ol style="padding-left:20px;margin:0"><li>Z jednego zasilacza podajemy prąd na uzwojenie wzbudzenia (stojan), co wytwarza stałe pole magnetyczne (strumień ${S('Φ','w')}).</li><li>Z drugiego zasilacza podajemy napięcie na uzwojenie twornika (wirnik). Na przewodnik z prądem ${S('I','t')} w polu ${S('Φ','w')} działa siła elektrodynamiczna, która tworzy moment ${S('M','e')} i wprawia wirnik w ruch.</li></ol></div></details>
<details><summary>Jakie są rodzaje regulacji prędkości?</summary><div class="a"><ol style="padding-left:20px;margin:0"><li><b>Rezystorowa</b> (zmiana ${S('R','d')} w obwodzie twornika): regulacja „w dół” przez dokładanie oporu w szereg z wirnikiem. Duże straty mocy na ciepło.</li><li><b>Napięciowa</b> (zmiana ${S('U','t')}): regulacja „w dół”, zmniejszamy napięcie od znamionowego. Najlepsza i najbardziej ekonomiczna.</li><li><b>Wzbudzeniem</b> (zmiana ${S('Φ','w')} / ${S('I','w')}): regulacja „w górę”, powyżej prędkości znamionowej, przez osłabianie ${S('I','w')} poniżej znamionowego.</li></ol></div></details>
<details><summary>Charakterystyki: jak wyglądają i jak się zmieniają?</summary><div class="a">Wszystkie charakterystyki to <b>proste opadające w dół</b>. Rysunki znajdziesz w sekcji 6 niżej.</div></details>
</div>

<div class="card sec" id="p6"><h2><span class="n">6</span>Jak to narysować na kartce</h2>
<p>Na osi pionowej zawsze podpisz prędkość <b>ω</b>, a na poziomej prąd twornika <b>${S('I','t')}</b> (lub moment <b>${S('M','e')}</b>). Punkt startowy na osi pionowej to prędkość biegu jałowego <b>${S('ω','0')}</b>.</p>
<h3>A. Rezystancja dodatkowa: „wachlarz z góry”</h3><p>Wszystkie linie wychodzą z jednego punktu ${S('ω','0N')} i opadają coraz bardziej stromo, gdy dokładamy rezystancję.</p>${fig('rd')}
<h3>B. Napięcie twornika: „schodki równoległe”</h3><p>Linie są równoległe. Im mniejsze napięcie, tym niżej leży cała prosta.</p>${fig('ut')}
<h3>C. Strumień wzbudzenia: „ucieczka w górę”</h3><p>Gdy zmniejszasz strumień (${S('Φ','w2')} < ${S('Φ','w1')} < ${S('Φ','wN')}), wykres startuje coraz wyżej, ale robi się coraz bardziej stromy. Od prądu: linie schodzą się w ${S('I','tz')}. Od momentu: linie się przecinają.</p>${fig('fi_i')}${fig('fi_m')}
<h3>D. Hamowanie: lewa strona (II kwadrant)</h3><p>Podczas hamowania moment i prąd są ujemne. <b>Dynamiczne:</b> linie wychodzą ze środka (0,0) w lewo do góry, a im większe ${S('R','h')}, tym bardziej stromo. <b>Przeciwwłączenie:</b> linie są przedłużeniem w lewo, przechodzą przez oś pionową i schodzą aż do −${S('ω','0')}.</p>${fig('dyn')}${fig('prz')}
</div>`;

/* QUIZ */
let qz;
function startQuiz(){qz={list:shuffle(QUIZ).slice(0,10).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}),i:0,ok:0};renderQ();}
function renderQ(){
  const q=qz.list[qz.i],n=qz.list.length;
  $('#quizBox').innerHTML=`<div class="qhead"><span>Pytanie ${qz.i+1} / ${n}</span><span>✓ ${qz.ok}</span></div>
  <div class="bar"><i style="width:${qz.i/n*100}%"></i></div>
  <div class="qtext">${q.q}</div>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
  <div class="expl" id="qExpl"></div>
  <button class="btn full" id="qNext" style="margin-top:14px;display:none">${qz.i+1<n?'Dalej →':'Zobacz wynik'}</button>`;
  $('#quizBox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(+b.dataset.i));
  $('#qNext').onclick=()=>{qz.i++;qz.i<n?renderQ():endQ()};
}
function answerQ(i){
  const q=qz.list[qz.i],bs=$('#quizBox').querySelectorAll('.opt');
  bs.forEach(b=>b.disabled=true);bs[q.a].classList.add('ok');
  if(i===q.a){qz.ok++;addXP(10);toast('Dobrze! +10 XP');vibe(20)}else{bs[i].classList.add('bad');vibe([40,40,40])}
  const ex=$('#qExpl');ex.innerHTML=(i===q.a?'<b style="color:var(--ok)">Dobrze!</b> ':'<b style="color:var(--bad)">Nie tym razem.</b> ')+q.e;ex.classList.add('on');
  $('#qNext').style.display='block';$('#qNext').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function endQ(){
  const n=qz.list.length,best=Math.max(store.get('qbest',0),qz.ok);store.set('qbest',best);
  const msg=qz.ok>=9?'Mistrzostwo! 🏆':qz.ok>=7?'Bardzo dobrze 💪':qz.ok>=5?'Nieźle, jeszcze trochę powtórki':'Przejrzyj przebieg zajęć i spróbuj ponownie';
  $('#quizBox').innerHTML=`<div class="result"><div class="big">${qz.ok}/${n}</div><h2>${msg}</h2><p class="muted">Najlepszy wynik: ${best}/${n}</p>

  $('#qAgain').onclick=startQuiz;
}

/* PARY */
let pr;
function startPairs(){
  const set=shuffle(FISZKI.map((_,i)=>i)).slice(0,5);
  const L=shuffle(set).map(i=>({i,h:FISZKI[i][0].replace(/\?$/,''),t:1})),Rr=shuffle(set).map(i=>({i,h:FISZKI[i][2],t:0}));
  pr={sel:null,left:set.length,miss:0,t0:Date.now()};
  const cells=[];for(let k=0;k<set.length;k++)cells.push(L[k],Rr[k]);
  $('#pairs').innerHTML=cells.map(c=>`<button class="pc ${c.t?'term':''}" data-i="${c.i}" data-t="${c.t}"><span>${c.h}</span></button>`).join('');
  $('#pEnd').style.display='none';$('#pStat').textContent='Pomyłki: 0';
  $('#pairs').querySelectorAll('.pc').forEach(b=>b.onclick=()=>tapPair(b));
}
function tapPair(b){
  if(!pr.sel){pr.sel=b;b.classList.add('sel');return}
  if(pr.sel===b){b.classList.remove('sel');pr.sel=null;return}
  if(pr.sel.dataset.t===b.dataset.t){pr.sel.classList.remove('sel');pr.sel=b;b.classList.add('sel');return}
  const a=pr.sel;pr.sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){a.classList.add('done');b.classList.add('done');addXP(5);vibe(15);pr.left--;
    if(!pr.left){const s=Math.round((Date.now()-pr.t0)/1000);const best=store.get('pbest',null);const nb=best===null||s<best;if(nb)store.set('pbest',s);
      $('#pEnd').innerHTML=`<div class="result" style="padding:10px"><div class="big">${s}s</div><p class="muted">Pomyłki: ${pr.miss}${nb?' · nowy rekord! 🏆':' · rekord: '+best+'s'}</p><button class="btn full" id="pAgain">Nowa runda</button></div>`;
      $('#pEnd').style.display='block';$('#pAgain').onclick=startPairs;}
  }else{pr.miss++;$('#pStat').textContent='Pomyłki: '+pr.miss;[a,b].forEach(x=>{x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),400)});vibe([30,30,30])}
}

/* PRAWDA / FAŁSZ */
let tf,tfTimer;
function tfIntro(){stopTF();const best=store.get('tfbest',0);
  $('#tfBox').innerHTML=`<div class="result"><div class="big">60s</div><h2>Prawda czy fałsz?</h2><p class="muted">Odpowiadaj jak najszybciej. Pomyłka zabiera 3 sekundy.<br>Rekord: <b>${best}</b> pkt</p><button class="btn full" id="tfGo">Start!</button></div>`;
  $('#tfGo').onclick=startTF;}
function startTF(){
  tf={deck:shuffle(TF),i:0,pts:0,streak:0,end:Date.now()+60000,lock:false};
  $('#tfBox').innerHTML=`<div class="qhead"><span class="timer" id="tfT">60</span><span style="align-self:center">Punkty: <b id="tfP">0</b> · Seria: <b id="tfS">0</b></span></div>
   <div class="bar"><i id="tfBar" style="width:100%;transition:width .2s linear"></i></div>
   <div class="card tfcard" id="tfQ" style="margin-top:12px"></div>
   <div class="tfbtns"><button class="tfn" data-a="0">✗ Fałsz</button><button class="tfy" data-a="1">✓ Prawda</button></div>
   <div class="muted" id="tfE" style="min-height:44px;margin-top:10px;font-size:14px;text-align:center"></div>`;
  $('#tfBox').querySelectorAll('.tfbtns button').forEach(b=>b.onclick=()=>ansTF(b.dataset.a==='1'));
  showTF();tfTimer=setInterval(tickTF,200);
}
function showTF(){if(tf.i>=tf.deck.length){tf.deck=shuffle(TF);tf.i=0}$('#tfQ').className='card tfcard';$('#tfQ').innerHTML=tf.deck[tf.i][0];}
function ansTF(v){if(tf.lock)return;const it=tf.deck[tf.i];const ok=v===it[1];tf.lock=true;
  $('#tfQ').classList.add(ok?'ok':'bad');
  if(ok){tf.streak++;tf.pts+=1+Math.floor(tf.streak/5);addXP(5);vibe(15)}else{tf.streak=0;tf.end-=3000;vibe([40,40,40])}
  $('#tfP').textContent=tf.pts;$('#tfS').textContent=tf.streak;
  $('#tfE').innerHTML=(ok?'✓ ':'✗ ')+it[2];
  setTimeout(()=>{tf.lock=false;tf.i++;if(tf.end>Date.now())showTF()},ok?350:1000);}
function tickTF(){const left=Math.max(0,tf.end-Date.now());$('#tfT').textContent=Math.ceil(left/1000);$('#tfBar').style.width=left/600+'%';
  if(!left){stopTF();const best=store.get('tfbest',0),nb=tf.pts>best;if(nb)store.set('tfbest',tf.pts);
   $('#tfBox').innerHTML=`<div class="result"><div class="big">${tf.pts}</div><h2>${nb?'Nowy rekord! 🏆':'Koniec czasu'}</h2><p class="muted">Rekord: ${Math.max(best,tf.pts)} pkt</p><button class="btn full" id="tfGo">Zagraj jeszcze raz</button></div>`;
   $('#tfGo').onclick=startTF;}}
function stopTF(){clearInterval(tfTimer)}

/* ROZPOZNAJ WYKRES */
let wk=null,wst={ok:0,all:0},wlast=-1;
function newWyk(){
  let i;do{i=R(0,WYK.length-1)}while(i===wlast);wlast=i;
  const others=shuffle(WYK.filter((_,j)=>j!==i)).slice(0,3);const opts=shuffle([WYK[i],...others]);
  wk={i,opts,done:false};
  $('#wykBox').innerHTML=`<div class="qhead"><span>Co przedstawia ta charakterystyka?</span><span>✓ ${wst.ok} / ${wst.all}</span></div>
   <div class="chart" id="wChart">${CH[WYK[i][0]](false)}</div>
   <div class="opts" style="margin-top:12px">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o[1]}</span></button>`).join('')}</div>
   <div class="expl" id="wExpl"></div>
   <button class="btn full" id="wNext" style="margin-top:12px;display:none">Następny wykres →</button>`;
  $('#wykBox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>ansWyk(+b.dataset.k));
  $('#wNext').onclick=newWyk;
}
function ansWyk(k){if(wk.done)return;wk.done=true;const bs=$('#wykBox').querySelectorAll('.opt');const ci=wk.opts.indexOf(WYK[wk.i]);
  bs.forEach(b=>b.disabled=true);bs[ci].classList.add('ok');wst.all++;
  if(k===ci){wst.ok++;addXP(10);toast('Dobrze! +10 XP');vibe(20)}else{bs[k].classList.add('bad');vibe([40,40,40])}
  $('#wChart').innerHTML=CH[WYK[wk.i][0]](true);
  $('#wExpl').innerHTML=(k===ci?'<b style="color:var(--ok)">Dobrze!</b> ':'<b style="color:var(--bad)">Nie tym razem.</b> ')+WYK[wk.i][2];$('#wExpl').classList.add('on');
  $('#wNext').style.display='block';$('#wNext').scrollIntoView({behavior:'smooth',block:'nearest'});}

go(location.hash.slice(1)||'home');
</script>
