<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Napędy Elektryczne — Ucz się grając</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1218; --panel:#171c25; --panel2:#1f2632; --line:#2a3342;
  --txt:#e8edf5; --mut:#93a0b4; --acc:#ffb020; --acc2:#3ec7ff;
  --ok:#35d07f; --bad:#ff5a6a; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#ff6a00);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
header.top h1{font-size:20px;margin:0;line-height:1.1}
header.top p{margin:0;color:var(--mut);font-size:13px}
.pts{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.pts b{color:var(--acc)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(15,18,24,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--mut);font-size:11px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);background:var(--panel)}
@media(min-width:820px){
  nav.tabs{position:sticky;top:0;bottom:auto;border:0;background:transparent;padding:0;margin-bottom:18px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:6px;font-size:13px;padding:10px 4px;border:1px solid var(--line)}
  .wrap{padding-bottom:40px}
}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--acc);color:#1a1200;font-weight:700;padding:14px 18px;border-radius:14px;min-height:50px;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.full{width:100%}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff6a00);width:0;transition:width .3s}
.f{font-family:"Space Grotesk",monospace;background:var(--panel2);padding:1px 6px;border-radius:6px}

/* home */
.hero{padding:22px;background:radial-gradient(120% 120% at 100% 0,#3a2a07 0,var(--panel) 55%);}
.hero h2{margin:0 0 6px;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:118px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .08s}
.tile:hover{border-color:var(--acc)}
.tile:active{transform:scale(.98)}
.tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--panel2)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-family:"Space Grotesk";font-size:17px}
.tile span{font-size:13px;color:var(--mut)}
.tile em{font-style:normal;font-size:12px;color:var(--acc);margin-top:auto}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:0 0 8px}
.qtext{font-size:19px;font-weight:600;margin:14px 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:54px;font-size:16px;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:rgba(53,208,127,.12)}
.opt.bad{border-color:var(--bad);background:rgba(255,90,106,.12)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg);border-left:4px solid var(--acc2);font-size:15px;display:none}
.expl.on{display:block}
.result{text-align:center;padding:26px 18px}
.big{font-size:56px;font-family:"Space Grotesk";font-weight:700;color:var(--acc);line-height:1}

/* flash */
.flash{perspective:1200px;height:300px;margin:12px 0;touch-action:pan-y}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line)}
.face.front{background:linear-gradient(160deg,#232b39,var(--panel))}
.face.front h3{font-size:26px;margin:0}
.face.back{background:linear-gradient(160deg,#10283a,var(--panel));transform:rotateY(180deg);font-size:17px}
.face small{position:absolute;bottom:14px;color:var(--mut);font-size:12px}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pc{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:64px;font-size:14px;line-height:1.3;text-align:center;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pc.term{font-weight:700;font-family:"Space Grotesk";font-size:15px}
.pc.sel{border-color:var(--acc2);background:rgba(62,199,255,.12)}
.pc.done{opacity:.25;border-color:var(--ok);pointer-events:none}
.pc.wrong{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* tf */
.tfcard{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:600;padding:24px;line-height:1.4;transition:background .2s}
.tfcard.ok{background:rgba(53,208,127,.15)}
.tfcard.bad{background:rgba(255,90,106,.15)}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tfbtns button{min-height:76px;border-radius:18px;font-size:20px;font-weight:700;font-family:"Space Grotesk"}
.tfy{background:var(--ok);color:#03200f}
.tfn{background:var(--bad);color:#2a0006}
.timer{font-family:"Space Grotesk";font-size:28px;font-weight:700}

/* calc */
.task{font-size:18px;line-height:1.55;margin:10px 0 14px}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:14px;color:var(--txt);font:600 20px "Space Grotesk";padding:12px 14px;outline:none}
.inp input:focus{border-color:var(--acc)}
.inp .unit{align-self:center;color:var(--mut);font-weight:600;min-width:48px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.seg button{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}

/* formulas */
.fl{display:grid;gap:10px}
.fl details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.fl summary{cursor:pointer;padding:12px 0;font-weight:600;font-family:"Space Grotesk";font-size:17px;list-style:none;display:flex;justify-content:space-between}
.fl summary::after{content:"+";color:var(--acc);font-size:22px;line-height:1}
.fl details[open] summary::after{content:"–"}
.fl ul{margin:0 0 14px;padding-left:18px}
.fl li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:all .25s;pointer-events:none;z-index:20;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <div><h1>Napędy Elektryczne</h1><p>Ucz się grając · lab RAP</p></div>
    <div class="pts">⚡ <b id="xp">0</b> XP</div>
  </header>

  <nav class="tabs"><div class="in" id="nav"></div></nav>

  <!-- HOME -->
  <section class="view on" id="v-home">
    <div class="card hero">
      <h2>Wybierz tryb nauki</h2>
      <div class="muted">Silniki DC i indukcyjne, przekształtniki, hamowanie, regulacja. Za każdą dobrą odpowiedź dostajesz XP.</div>
    </div>
    <div class="grid" id="tiles"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz"><div class="card" id="quizBox"></div></section>

  <!-- FLASH -->
  <section class="view" id="v-flash">
    <div class="card">
      <div class="qhead"><span id="fCount"></span><span id="fKnown"></span></div>
      <div class="bar"><i id="fBar"></i></div>
      <div class="flash" id="flash"><div class="in">
        <div class="face front"><h3 id="fTerm"></h3><small>dotknij, aby odwrócić · przesuń, aby zmienić</small></div>
        <div class="face back"><div id="fDef"></div><small>dotknij, aby wrócić</small></div>
      </div></div>
      <div class="fbtns">
        <button class="btn sec" id="fAgain">🔁 Jeszcze raz</button>
        <button class="btn" id="fGot">✓ Umiem</button>
      </div>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <button class="chip" id="fShuffle">Przetasuj</button>
        <button class="chip" id="fReset">Zacznij od nowa</button>
      </div>
    </div>
  </section>

  <!-- PAIRS -->
  <section class="view" id="v-pairs">
    <div class="card">
      <div class="qhead"><span>Połącz pojęcie z opisem</span><span id="pStat"></span></div>
      <div class="pairs" id="pairs"></div>
      <div id="pEnd" style="display:none;margin-top:14px"></div>
    </div>
  </section>

  <!-- TF -->
  <section class="view" id="v-tf"><div class="card" id="tfBox"></div></section>

  <!-- CALC -->
  <section class="view" id="v-calc">
    <div class="card">
      <div class="seg" id="calcSeg"></div>
      <div class="qhead"><span id="cTopic"></span><span id="cStat"></span></div>
      <div class="task" id="cTask"></div>
      <form class="inp" id="cForm" autocomplete="off">
        <input id="cIn" inputmode="decimal" placeholder="Twój wynik">
        <span class="unit" id="cUnit"></span>
      </form>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="cCheck" style="flex:1">Sprawdź</button>
        <button class="btn sec" id="cSkip">Pokaż</button>
      </div>
      <div class="expl" id="cExpl"></div>
      <button class="btn sec full" id="cNext" style="margin-top:12px;display:none">Następne zadanie →</button>
    </div>
  </section>

  <!-- FORMULAS -->
  <section class="view" id="v-wzory"><div class="fl" id="wzory"></div></section>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   TREŚĆ — tu podmieniasz materiał. Reszta strony sama się dopasuje.
   ========================================================= */
const FISZKI = [
 ["Prędkość synchroniczna","n<sub>s</sub> = 60·f / p [obr/min], gdzie p — liczba par biegunów. Dla 50 Hz i p=2: 1500 obr/min."],
 ["Poślizg","s = (n<sub>s</sub> − n) / n<sub>s</sub>. Praca silnikowa: 0 < s ≤ 1, prądnicowa: s < 0, hamowanie przeciwprądem: s > 1."],
 ["Częstotliwość prądu wirnika","f<sub>2</sub> = s · f<sub>1</sub>. Przy poślizgu 4% i 50 Hz to tylko 2 Hz."],
 ["Moment krytyczny","Maksymalny moment silnika indukcyjnego (moment utyku), przy poślizgu krytycznym s<sub>k</sub>. Jest proporcjonalny do U²."],
 ["Wzór Klossa","M / M<sub>k</sub> = 2 / (s/s<sub>k</sub> + s<sub>k</sub>/s) — uproszczona charakterystyka mechaniczna silnika indukcyjnego."],
 ["Sterowanie U/f = const","Przy zmianie częstotliwości zmienia się proporcjonalnie napięcie, żeby utrzymać stały strumień. Stosowane poniżej częstotliwości znamionowej."],
 ["Osłabianie pola","Praca powyżej prędkości znamionowej: napięcie już nie rośnie, strumień maleje, napęd pracuje ze stałą mocą, a moment maleje."],
 ["Równanie ruchu napędu","M − M<sub>obc</sub> = J · dω/dt. Gdy M > M<sub>obc</sub>, napęd przyspiesza; gdy równe — praca ustalona."],
 ["SEM silnika DC","E = k·Φ·ω. Napięcie twornika: U = E + I<sub>t</sub>·R<sub>t</sub>."],
 ["Moment silnika DC","M = k·Φ·I<sub>t</sub> — moment proporcjonalny do prądu twornika przy stałym strumieniu."],
 ["Charakterystyka silnika obcowzbudnego","ω = U/(kΦ) − R·M/(kΦ)². Prosta, sztywna, lekko opadająca."],
 ["Regulacja prędkości DC","1) napięciem twornika (do ω<sub>n</sub>, stały moment), 2) strumieniem wzbudzenia (powyżej ω<sub>n</sub>, stała moc), 3) rezystancją w obwodzie twornika (duże straty)."],
 ["Silnik szeregowy DC","Uzwojenie wzbudzenia w szeregu z twornikiem. Duży moment rozruchowy, miękka charakterystyka; nie wolno go uruchamiać bez obciążenia — rozbiega się."],
 ["Rozruch gwiazda-trójkąt","Na czas rozruchu uzwojenia łączy się w gwiazdę: prąd i moment rozruchowy są 3 razy mniejsze niż przy trójkącie."],
 ["Falownik napięcia (VSI)","Zamienia napięcie stałe obwodu pośredniczącego na trójfazowe o regulowanej częstotliwości i amplitudzie (zwykle przez PWM)."],
 ["PWM","Modulacja szerokości impulsów. Wartość średnia napięcia = D · U<sub>d</sub>, gdzie D — współczynnik wypełnienia."],
 ["Przerywacz (chopper)","Przekształtnik DC/DC do regulacji napięcia zasilającego silnik prądu stałego."],
 ["Prostownik tyrystorowy","U<sub>d</sub> = U<sub>d0</sub>·cos α. Dla α > 90° napięcie jest ujemne — praca falownikowa (zwrot energii do sieci)."],
 ["Hamowanie odzyskowe","Rekuperacja — energia wraca do sieci lub obwodu DC. W silniku indukcyjnym gdy n > n<sub>s</sub> (s < 0)."],
 ["Hamowanie dynamiczne","DC: twornik odłączony od zasilania i zamknięty przez rezystor. Indukcyjny: stojan zasilony prądem stałym."],
 ["Hamowanie przeciwprądem","Zmiana kolejności faz lub biegunowości przy wirującym wirniku. Poślizg s > 1, duże prądy, energia tracona w maszynie."],
 ["Praca czterokwadrantowa","Kwadranty I i III — praca silnikowa (M i ω tego samego znaku), II i IV — hamowanie (znaki przeciwne)."],
 ["Sterowanie wektorowe (FOC)","Rozkład prądu stojana na składową i<sub>d</sub> (strumień) i i<sub>q</sub> (moment) w wirującym układzie dq — silnik AC sterowany jak obcowzbudny DC."],
 ["DTC","Direct Torque Control: bezpośrednie sterowanie momentem i strumieniem przez wybór wektora napięcia z tablicy, regulatory histerezowe."],
 ["Regulacja kaskadowa","Wewnętrzna, najszybsza pętla prądu (momentu), nad nią pętla prędkości, potem położenia. Zwykle regulatory PI."],
 ["Moment bezwładności sprowadzony","J<sub>z</sub> = J<sub>s</sub> + J<sub>m</sub> / i², gdzie i — przełożenie przekładni (prędkość silnika / prędkość maszyny)."],
 ["Enkoder inkrementalny","Czujnik generujący określoną liczbę impulsów na obrót; służy do pomiaru prędkości i położenia (kanały A, B, Z)."],
 ["PMSM","Silnik synchroniczny z magnesami trwałymi — wirnik obraca się dokładnie z prędkością synchroniczną, wysoka sprawność."],
 ["Moc mechaniczna","P = M · ω, gdzie ω = 2π·n/60 [rad/s]."]
];

const QUIZ = [
 {q:"Ile wynosi prędkość synchroniczna silnika 4-biegunowego przy 50 Hz?", o:["3000 obr/min","1500 obr/min","1000 obr/min","750 obr/min"], a:1, e:"4 bieguny = 2 pary (p=2). n<sub>s</sub> = 60·50/2 = 1500 obr/min."},
 {q:"Jaki poślizg ma silnik indukcyjny w czasie hamowania odzyskowego?", o:["s > 1","0 < s < 1","s = 1","s < 0"], a:3, e:"Hamowanie odzyskowe zachodzi, gdy wirnik obraca się szybciej niż pole (n > n<sub>s</sub>), więc s < 0 — maszyna pracuje jako prądnica."},
 {q:"Po co stosuje się sterowanie U/f = const?", o:["Żeby utrzymać stały strumień magnetyczny","Żeby utrzymać stały poślizg","Żeby zwiększyć moment krytyczny ponad znamionowy","Żeby zmniejszyć prędkość synchroniczną bez zmiany f"], a:0, e:"Strumień jest proporcjonalny do U/f. Utrzymując stały stosunek, utrzymujemy stały strumień, a więc możliwość osiągnięcia znamionowego momentu."},
 {q:"Moment krytyczny silnika indukcyjnego zależy od napięcia zasilania:", o:["liniowo","z kwadratem napięcia","nie zależy","odwrotnie proporcjonalnie"], a:1, e:"M<sub>k</sub> ~ U². Spadek napięcia o 10% zmniejsza moment krytyczny o ok. 19%."},
 {q:"Ile razy zmniejsza się prąd rozruchowy przy rozruchu gwiazda-trójkąt?", o:["√3 razy","2 razy","3 razy","Nie zmienia się"], a:2, e:"Przy połączeniu w gwiazdę napięcie fazowe spada √3 razy, a prąd pobierany z sieci 3 razy (moment też 3 razy)."},
 {q:"Która metoda regulacji prędkości silnika obcowzbudnego DC pozwala przekroczyć prędkość znamionową?", o:["Zmiana napięcia twornika","Dodatkowa rezystancja w obwodzie twornika","Osłabianie strumienia wzbudzenia","Zwiększanie prądu wzbudzenia"], a:2, e:"ω ≈ U/(kΦ). Zmniejszając strumień Φ, zwiększamy prędkość ponad znamionową — kosztem momentu (praca ze stałą mocą)."},
 {q:"W którym kwadrancie układu M–ω silnik hamuje przy obrotach w prawo?", o:["I","II","III","IV"], a:1, e:"Obroty w prawo: ω > 0. Hamowanie: moment przeciwny do prędkości, M < 0 — kwadrant II."},
 {q:"Co opisuje równanie M − M<sub>obc</sub> = J·dω/dt?", o:["Charakterystykę mechaniczną silnika","Równanie ruchu napędu","Bilans mocy w tworniku","Wzór Klossa"], a:1, e:"To podstawowe równanie ruchu: nadwyżka momentu silnika nad momentem obciążenia przyspiesza masy wirujące."},
 {q:"Prostownik tyrystorowy pracuje falownikowo (oddaje energię do sieci), gdy kąt załączenia α wynosi:", o:["α = 0°","0° < α < 90°","90° < α < 180°","α = 45°"], a:2, e:"U<sub>d</sub> = U<sub>d0</sub>·cos α. Dla α > 90° cos α < 0, więc napięcie średnie jest ujemne — energia płynie z maszyny do sieci."},
 {q:"Silnik indukcyjny 1500 obr/min (synchr.) pracuje z prędkością 1440 obr/min. Poślizg wynosi:", o:["2%","4%","6%","60%"], a:1, e:"s = (1500 − 1440)/1500 = 60/1500 = 0,04 = 4%."},

 "poślizg":()=>{const p=R(1,3),ns=3000/p,s=R(2,8)/100,n=Math.round(ns*(1-s));const sv=(ns-n)/ns*100;
   return{t:`Prędkość synchroniczna wynosi <b>${ns} obr/min</b>, a wirnik obraca się z prędkością <b>${n} obr/min</b>. Oblicz poślizg.`,a:sv,u:"%",e:`s = (${ns} − ${n})/${ns} = ${fmt(sv/100,4)} = <b>${fmt(sv)}%</b>`}},
 "n z poślizgu":()=>{const p=R(1,4),ns=3000/p,s=R(2,7);const n=ns*(1-s/100);
   return{t:`Silnik ${2*p}-biegunowy (50 Hz) pracuje z poślizgiem <b>${s}%</b>. Z jaką prędkością obraca się wirnik?`,a:n,u:"obr/min",e:`n<sub>s</sub> = 3000/${p} = ${fmt(ns)}; n = n<sub>s</sub>(1 − s) = ${fmt(ns)}·${fmt(1-s/100)} = <b>${fmt(n,1)}</b> obr/min`}},
 "f wirnika":()=>{const f=pick([50,60,40]),s=R(1,9)/100*(Math.random()<.2?10:1);const f2=s*f;

 "moc P=Mω":()=>{const M=R(5,120),n=pick([750,960,1000,1440,1460,1500,2900,3000]);const w=2*Math.PI*n/60,P=M*w/1000;
   return{t:`Silnik rozwija moment <b>${M} N·m</b> przy prędkości <b>${n} obr/min</b>. Oblicz moc mechaniczną.`,a:P,u:"kW",e:`ω = 2π·${n}/60 = ${fmt(w)} rad/s; P = M·ω = ${M}·${fmt(w)} = ${fmt(P*1000,0)} W = <b>${fmt(P)}</b> kW`}},

function go(v){
  if(!document.getElementById('v-'+v))v='home';
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));

/* ---------- QUIZ ---------- */
let qz;
function startQuiz(){qz={list:shuffle(QUIZ).slice(0,10).map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return{...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}),i:0,ok:0};renderQ();}
function renderQ(){
  const q=qz.list[qz.i],n=qz.list.length;
  $('#quizBox').innerHTML=`<div class="qhead"><span>Pytanie ${qz.i+1} / ${n}</span><span>✓ ${qz.ok}</span></div>
  <div class="bar"><i style="width:${qz.i/n*100}%"></i></div>
  <div class="qtext">${q.q}</div>
  <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>
  <div class="expl" id="qExpl"></div>
  <button class="btn full" id="qNext" style="margin-top:14px;display:none">${qz.i+1<n?'Dalej →':'Zobacz wynik'}</button>`;
  $('#quizBox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerQ(+b.dataset.i));
  $('#qNext').onclick=()=>{qz.i++;qz.i<n?renderQ():endQ()};
}
function answerQ(i){
  const q=qz.list[qz.i],bs=$('#quizBox').querySelectorAll('.opt');
  bs.forEach(b=>b.disabled=true);bs[q.a].classList.add('ok');
  if(i===q.a){qz.ok++;addXP(10);toast('Dobrze! +10 XP');vibe(20)}else{bs[i].classList.add('bad');vibe([40,40,40])}
  const ex=$('#qExpl');ex.innerHTML=(i===q.a?'<b style="color:var(--ok)">Dobrze!</b> ':'<b style="color:var(--bad)">Nie tym razem.</b> ')+q.e;ex.classList.add('on');
  $('#qNext').style.display='block';$('#qNext').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function endQ(){
  const n=qz.list.length,best=Math.max(store.get('qbest',0),qz.ok);store.set('qbest',best);
  const msg=qz.ok>=9?'Mistrzostwo! 🏆':qz.ok>=7?'Bardzo dobrze 💪':qz.ok>=5?'Nieźle, jeszcze trochę powtórki':'Przejrzyj fiszki i spróbuj ponownie';
  $('#quizBox').innerHTML=`<div class="result"><div class="big">${qz.ok}/${n}</div><h2>${msg}</h2><p class="muted">Najlepszy wynik: ${best}/${n}</p>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="qAgain">Jeszcze raz</button><button class="btn sec" data-v="flash">Fiszki</button></div></div>`;
  $('#qAgain').onclick=startQuiz;
}

/* ---------- FLASH ---------- */
let fdeck=shuffle(FISZKI.map((_,i)=>i)),fi=0,known=new Set(store.get('known',[]));
function renderFlash(){
  if(!fdeck.length){fdeck=FISZKI.map((_,i)=>i).filter(i=>!known.has(i));if(!fdeck.length){known.clear();store.set('known',[]);fdeck=shuffle(FISZKI.map((_,i)=>i));toast('Wszystkie umiesz! Zaczynamy od nowa 🎉')}}
  fi=Math.min(fi,fdeck.length-1);
  const c=FISZKI[fdeck[fi]];
  $('#flash').classList.remove('flip');
  setTimeout(()=>{$('#fTerm').innerHTML=c[0];$('#fDef').innerHTML=c[1];},120);
  $('#fCount').textContent=`Karta ${fi+1} / ${fdeck.length}`;
  $('#fKnown').textContent=`Umiem: ${known.size} / ${FISZKI.length}`;
  $('#fBar').style.width=known.size/FISZKI.length*100+'%';
}
$('#flash').onclick=()=>$('#flash').classList.toggle('flip');
$('#fGot').onclick=()=>{known.add(fdeck[fi]);store.set('known',[...known]);addXP(2);fdeck.splice(fi,1);if(fi>=fdeck.length)fi=0;renderFlash()};
$('#fAgain').onclick=()=>{fi=(fi+1)%fdeck.length;renderFlash()};
$('#fShuffle').onclick=()=>{fdeck=shuffle(fdeck);fi=0;renderFlash()};
$('#fReset').onclick=()=>{known.clear();store.set('known',[]);fdeck=shuffle(FISZKI.map((_,i)=>i));fi=0;renderFlash()};
(()=>{let x0=null;const el=$('#flash');
 el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
 el.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>60){e.preventDefault();fi=(fi+(dx<0?1:fdeck.length-1))%fdeck.length;renderFlash()}});
})();

function startPairs(){
  const set=shuffle(FISZKI.map((_,i)=>i)).slice(0,5);
  const short=d=>{let t=d.replace(/<[^>]+>/g,'');t=t.split(/(?<=[.:])\s/)[0];return t.length>80?t.slice(0,78)+'…':t};
  const L=shuffle(set).map(i=>({i,h:FISZKI[i][0],t:1})),Rr=shuffle(set).map(i=>({i,h:short(FISZKI[i][1]),t:0}));
  pr={sel:null,left:set.length,miss:0,t0:Date.now()};
  const cells=[];for(let k=0;k<set.length;k++){cells.push(L[k],Rr[k])}
  $('#pairs').innerHTML=cells.map(c=>`<button class="pc ${c.t?'term':''}" data-i="${c.i}" data-t="${c.t}">${c.h}</button>`).join('');
  $('#pEnd').style.display='none';$('#pStat').textContent='Pomyłki: 0';
  $('#pairs').querySelectorAll('.pc').forEach(b=>b.onclick=()=>tapPair(b));
}
function tapPair(b){
  if(!pr.sel){pr.sel=b;b.classList.add('sel');return}
  if(pr.sel===b){b.classList.remove('sel');pr.sel=null;return}
  if(pr.sel.dataset.t===b.dataset.t){pr.sel.classList.remove('sel');pr.sel=b;b.classList.add('sel');return}
  const a=pr.sel;pr.sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){a.classList.add('done');b.classList.add('done');addXP(5);vibe(15);pr.left--;
    if(!pr.left){const s=Math.round((Date.now()-pr.t0)/1000);const best=store.get('pbest',null);const nb=best===null||s<best;if(nb)store.set('pbest',s);
      $('#pEnd').innerHTML=`<div class="result" style="padding:10px"><div class="big">${s}s</div><p class="muted">Pomyłki: ${pr.miss}${nb?' · nowy rekord! 🏆':' · rekord: '+best+'s'}</p><button class="btn full" id="pAgain">Nowa runda</button></div>`;
      $('#pEnd').style.display='block';$('#pAgain').onclick=startPairs;}
  }else{pr.miss++;$('#pStat').textContent='Pomyłki: '+pr.miss;[a,b].forEach(x=>{x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),400)});vibe([30,30,30])}
}

/* ---------- TRUE/FALSE ---------- */
let tf,tfTimer;
function tfIntro(){stopTF();const best=store.get('tfbest',0);
  $('#tfBox').innerHTML=`<div class="result"><div class="big">60s</div><h2>Prawda czy fałsz?</h2><p class="muted">Odpowiadaj jak najszybciej. Pomyłka zabiera 3 sekundy.<br>Rekord: <b>${best}</b> pkt</p><button class="btn full" id="tfGo">Start!</button></div>`;
  $('#tfGo').onclick=startTF;}
function startTF(){
  tf={deck:shuffle(TF),i:0,pts:0,streak:0,end:Date.now()+60000,lock:false};
  $('#tfBox').innerHTML=`<div class="qhead"><span class="timer" id="tfT">60</span><span style="align-self:center">Punkty: <b id="tfP">0</b> · Seria: <b id="tfS">0</b></span></div>
   <div class="bar"><i id="tfBar" style="width:100%;transition:width .2s linear"></i></div>
   <div class="card tfcard" id="tfQ" style="margin-top:12px"></div>
   <div class="tfbtns"><button class="tfn" data-a="0">✗ Fałsz</button><button class="tfy" data-a="1">✓ Prawda</button></div>
   <div class="muted" id="tfE" style="min-height:44px;margin-top:10px;font-size:14px;text-align:center"></div>`;
  $('#tfBox').querySelectorAll('.tfbtns button').forEach(b=>b.onclick=()=>ansTF(b.dataset.a==='1'));
  showTF();tfTimer=setInterval(tickTF,200);
}
function showTF(){if(tf.i>=tf.deck.length){tf.deck=shuffle(TF);tf.i=0}$('#tfQ').className='card tfcard';$('#tfQ').innerHTML=tf.deck[tf.i][0];}
function ansTF(v){if(tf.lock)return;const it=tf.deck[tf.i];const ok=v===it[1];tf.lock=true;
  $('#tfQ').classList.add(ok?'ok':'bad');
  if(ok){tf.streak++;tf.pts+=1+Math.floor(tf.streak/5);addXP(5);vibe(15)}else{tf.streak=0;tf.end-=3000;vibe([40,40,40])}
  $('#tfP').textContent=tf.pts;$('#tfS').textContent=tf.streak;
  $('#tfE').innerHTML=(ok?'✓ ':'✗ ')+it[2];
  setTimeout(()=>{tf.lock=false;tf.i++;if(tf.end>Date.now())showTF()},ok?350:900);}
function tickTF(){const left=Math.max(0,tf.end-Date.now());$('#tfT').textContent=Math.ceil(left/1000);$('#tfBar').style.width=left/600+'%';
  if(!left){stopTF();const best=store.get('tfbest',0),nb=tf.pts>best;if(nb)store.set('tfbest',tf.pts);
   $('#tfBox').innerHTML=`<div class="result"><div class="big">${tf.pts}</div><h2>${nb?'Nowy rekord! 🏆':'Koniec czasu'}</h2><p class="muted">Rekord: ${Math.max(best,tf.pts)} pkt</p><button class="btn full" id="tfGo">Zagraj jeszcze raz</button></div>`;
   $('#tfGo').onclick=startTF;}}
function stopTF(){clearInterval(tfTimer)}

/* ---------- CALC ---------- */
let topic='losowo',cur=null,cst={ok:0,all:0};
const topics=['losowo',...Object.keys(ZAD)];
$('#calcSeg').innerHTML=topics.map(t=>`<button data-t="${t}" class="${t===topic?'on':''}">${t}</button>`).join('');
$('#calcSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{topic=b.dataset.t;$('#calcSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));newTask()});
function newTask(){
  const k=topic==='losowo'?pick(Object.keys(ZAD)):topic;cur={...ZAD[k](),k,done:false};
  $('#cTopic').textContent=k;$('#cStat').textContent=`✓ ${cst.ok} / ${cst.all}`;
  $('#cTask').innerHTML=cur.t;$('#cUnit').textContent=cur.u;$('#cIn').value='';$('#cIn').style.borderColor='';
  $('#cExpl').classList.remove('on');$('#cNext').style.display='none';
}
function check(){
  if(!cur||cur.done)return;const v=parseFloat($('#cIn').value.replace(',','.').replace(/\s/g,''));
  if(isNaN(v)){toast('Wpisz liczbę');return}
  const ok=Math.abs(v-cur.a)<=Math.max(Math.abs(cur.a)*0.02,0.011);
  cst.all++;if(ok){cst.ok++;addXP(15);toast('Świetnie! +15 XP');vibe(20)}else vibe([40,40,40]);
  $('#cIn').style.borderColor=ok?'var(--ok)':'var(--bad)';reveal(ok);
}
function reveal(ok){cur.done=true;$('#cExpl').innerHTML=(ok===true?'<b style="color:var(--ok)">Dobrze!</b><br>':ok===false?'<b style="color:var(--bad)">Nie zgadza się.</b><br>':'')+cur.e+'<br><span class="muted" style="font-size:13px">Tolerancja: ±2%</span>';
  $('#cExpl').classList.add('on');$('#cNext').style.display='block';$('#cStat').textContent=`✓ ${cst.ok} / ${cst.all}`;}
$('#cForm').onsubmit=e=>{e.preventDefault();cur&&cur.done?newTask():check()};
$('#cCheck').onclick=check;
$('#cSkip').onclick=()=>{if(cur&&!cur.done){cst.all++;reveal(null)}};
$('#cNext').onclick=newTask;

/* ---------- WZORY ---------- */
$('#wzory').innerHTML='<div class="card hero"><h2>Ściąga</h2><div class="muted">Najważniejsze wzory — rozwiń sekcję.</div></div>'+WZORY.map(([h,l],i)=>`<details ${i===0?'open':''}><summary>${h}</summary><ul>${l.map(x=>`<li><span class="f">${x}</span></li>`).join('')}</ul></details>`).join('');

go(location.hash.slice(1)||'home');
</script>
